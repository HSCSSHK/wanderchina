server:
  port: 8080

spring:
  application:
    name: wanderchina-backend
  profiles:
    active: dev
  # 未知路由交给 NoHandlerFoundException，由 GlobalExceptionHandler 归一化为 Result
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # 持久层：schema 由 Flyway 管理，Hibernate 不参与建表（§6.5）
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 雪花主键生成（§6.1）；单实例默认 worker/datacenter = 0
wanderchina:
  snowflake:
    worker-id: 0
    datacenter-id: 0
  # JWT：secret 只从环境变量注入，无默认值；缺失或不足 32 字节启动即失败
  auth:
    jwt:
      secret: ${JWT_SECRET}
      issuer: wanderchina
      access-token-ttl: 30m
      refresh-token-ttl: 14d

# dev/test 默认暴露 OpenAPI（prod 由 application-prod.yml 关闭）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
