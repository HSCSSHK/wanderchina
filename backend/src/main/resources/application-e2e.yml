# e2e：Playwright 专用隔离栈（8081 + wanderchina_e2e），与 dev/prod 完全隔离。
# 种子数据由 Flyway repeatable 迁移 db/e2e/R__e2e_seed.sql 管理，禁止手工插数。
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wanderchina_e2e?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/e2e
